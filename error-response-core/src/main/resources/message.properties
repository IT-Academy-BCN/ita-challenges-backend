###########################################################
# ? Validation and Error Messages (Default Locale)
# Used by BaseExceptionHandler and ValidationErrorResponseBuilder
###########################################################

# --- General Validation ---
validation.general=Validation failed for one or more input fields.

# --- ConstraintViolationException ---
# Thrown when method-level constraints (@Validated on controller parameters) fail
validation.constraint=One or more request parameters failed validation.
# Optional variant if you want to inject the first violated parameter name and message
validation.constraint.detailed=Validation failed for parameter '{0}': {1}

# --- MethodArgumentNotValidException ---
# Thrown when bean validation on request body DTO fails
validation.argument_not_valid=Validation failed for object '{0}'.


# --- MethodArgumentTypeMismatchException ---
# Thrown when a request parameter/path variable cannot be converted to the required type
validation.type_mismatch=Parameter '{0}' has invalid value '{1}'. Expected type: {2}.

# --- Fallback / Generic Bad Request ---
validation.bad_request=Invalid or malformed request.
