name: Upload Image to Docker Hub & Deploy to Dev

on:
  pull_request:
    types:
      - closed
    branches:
      - develop

jobs:
  docker:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      changed_services: ${{ steps.detect_services.outputs.changed_services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed microservices
        id: detect_services
        run: |
          BEFORE_SHA="${{ github.event.pull_request.base.sha }}"
          AFTER_SHA="${{ github.event.pull_request.merge_commit_sha }}"
          CHANGED_FILES=$(git diff --name-only $BEFORE_SHA $AFTER_SHA)
          CHANGED_SERVICES=$(echo "$CHANGED_FILES" | grep -E '^(itachallenge-auth|itachallenge-user|itachallenge-challenge|itachallenge-document|itachallenge-mock)/' | cut -d/ -f1 | sort -u | tr '\n' ' ')

          echo "Changed microservices: $CHANGED_SERVICES"
          echo "changed_services=$CHANGED_SERVICES" >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Login to Docker Hub
        run: |
          echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build & Push for each changed microservice
        run: |
          for SERVICE in ${{ steps.detect_services.outputs.changed_services }}; do
            echo "🔧 Processing microservice: $SERVICE"

            MICROSERVICE_VERSION=$(grep "^MICROSERVICE_VERSION_${SERVICE}=" conf/.env.CI.dev | cut -d '=' -f2)
            if [ -z "$MICROSERVICE_VERSION" ]; then
              echo "❌ ERROR: MICROSERVICE_VERSION for $SERVICE not found"
              exit 1
            fi

            export ENV=dev
            export REGISTRY_NAME=itacademybcn/itachallenges

            if [ "$SERVICE" = "itachallenge-auth" ]; then
              export GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }}
              export GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }}
            fi

            ./gradlew :${SERVICE}:clean :${SERVICE}:build -PMICROSERVICE_VERSION=${MICROSERVICE_VERSION}

            echo "🔍 Looking for .jar to copy in ${SERVICE}/build/libs..."
            JAR_PATH=$(find ${SERVICE}/build/libs -maxdepth 1 -name "*.jar" | head -n 1)

            if [ -z "$JAR_PATH" ]; then
              echo "❌ No .jar file found for $SERVICE. Exiting."
              exit 1
            fi

            cp "$JAR_PATH" ${SERVICE}/build/libs/${SERVICE}.jar
            echo "✅ Copied $JAR_PATH to ${SERVICE}/build/libs/${SERVICE}.jar"

            echo "🐳 Building Docker image..."
            if [ "$SERVICE" = "itachallenge-auth" ]; then
              docker build --build-arg GITHUB_CLIENT_ID=$GITHUB_CLIENT_ID \
                           --build-arg GITHUB_CLIENT_SECRET=$GITHUB_CLIENT_SECRET \
                           -t ${REGISTRY_NAME}:${SERVICE}-${MICROSERVICE_VERSION} ${SERVICE}
            else
              docker build -t ${REGISTRY_NAME}:${SERVICE}-${MICROSERVICE_VERSION} ${SERVICE}
            fi

            docker push ${REGISTRY_NAME}:${SERVICE}-${MICROSERVICE_VERSION}
            echo "✅ Pushed $SERVICE:$MICROSERVICE_VERSION"
          done

  deploy:
    if: github.event_name == 'pull_request' || github.event.pull_request.merged == true
    needs: docker
    runs-on: ubuntu-latest
    env:
      changed_services: ${{ needs.docker.outputs.changed_services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare environment for deploy
        if: env.changed_services != ''
        run: |
          for SERVICE in $changed_services; do
            while IFS='=' read -r key value; do
              if [[ "$key" == *"_$SERVICE" ]]; then
                new_key=$(echo "$key" | sed "s/_$SERVICE//")
                export "$new_key=$value"
              fi
            done < conf/.env.CI.dev
          done

      - name: Deploy changed microservices via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST_URL }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "🚀 Starting remote deploy..."
            REPO_ROOT="/root"
            cd "$REPO_ROOT" || { echo "❌ ERROR: Cannot access $REPO_ROOT"; exit 1; }

            chmod +x ./deploy_backend_dev.sh
            for SERVICE in $changed_services; do
              MICROSERVICE_VERSION=$(grep "^MICROSERVICE_VERSION_${SERVICE}=" conf/.env.CI.dev | cut -d '=' -f2)
              if [ -z "$MICROSERVICE_VERSION" ]; then
                echo "❌ ERROR: No version for $SERVICE, skipping"
                continue
              fi
              echo "🛠 Deploying $SERVICE version $MICROSERVICE_VERSION"
              ./deploy_backend_dev.sh $SERVICE $MICROSERVICE_VERSION
            done
            echo "✅ Remote deploy complete."
