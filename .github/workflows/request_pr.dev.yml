name: Pull Request Sonar Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TESTCONTAINERS_LOG_LEVEL: DEBUG

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Docker sanity check
        run: |
          docker version
          docker info

      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB..."
          for i in {1..30}; do
            nc -z 127.0.0.1 ${{ job.services.mongo.ports['27017'] }} && echo "MongoDB is ready" && exit 0
            sleep 2
          done
          echo "MongoDB did not become ready in time"
          docker logs ${{ job.services.mongo.id }} || true
          exit 1

      - name: Run Tests
        env:
          MONGODB_URI: mongodb://127.0.0.1:${{ job.services.mongo.ports['27017'] }}/test?directConnection=true
        run: |
          set -euxo pipefail
          ./gradlew clean test \
            --no-daemon \
            --console=plain \
            --info \
            --stacktrace

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/test-results/test/"

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: "**/build/reports/tests/"

      - name: SonarCloud Analysis
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # keep same DB for any tests executed during sonar task
          MONGODB_URI: mongodb://127.0.0.1:${{ job.services.mongo.ports['27017'] }}/test?directConnection=true
        run: ./gradlew sonar --no-daemon --info
