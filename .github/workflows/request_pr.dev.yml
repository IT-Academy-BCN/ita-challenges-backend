name: Pull Request Sonar Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better relevancy of analysis

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8

      # ✅ Eliminar la caché de Gradle antes de ejecutar los tests
      - name: Clear Gradle Cache
        run: rm -rf ~/.gradle/caches/

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      # ✅ Verificar versión de Gradle y Java en el runner
      - name: Check Java & Gradle Version
        run: |
          java -version
          ./gradlew --version
      # ✅ Ejecutar los tests y generar reportes, forzando que no use caché
      - name: Run Tests
        run: ./gradlew test --info --stacktrace --no-build-cache

      # ✅ Debug: Mostrar si el directorio de reportes realmente existe
      - name: Debug Test Reports Directory
        run: ls -lR itachallenge-challenge/build/reports/tests/ || echo "⚠️ Test reports not found!"

      # ✅ Subir el reporte de tests como artefacto
      - name: Upload Test Report
        if: always()  # Se ejecuta aunque los tests fallen
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: itachallenge-challenge/build/reports/tests/

      - name: Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: gradle build sonar --info --no-build-cache