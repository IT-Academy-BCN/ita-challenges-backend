name: Pull Request Sonar Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/settings.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Check Java & Gradle Version
        run: |
          java -version
          ./gradlew --version

      # --- Docker / Testcontainers ---
      - name: Docker diagnostics
        run: |
          echo "DOCKER_HOST=$DOCKER_HOST"
          docker version
          docker info
          ls -l /var/run/docker.sock || true

      - name: Start Docker (if needed)
        run: |
          sudo systemctl start docker || true
          docker info

      # --- Build & Tests ---
      - name: Build + Test
        run: ./gradlew build --info --stacktrace --no-build-cache

      # If build fails, print test XMLs to see the exact failing test/error
      - name: Print failing tests (JUnit XML)
        if: failure()
        run: |
          echo "=== Test result files ==="
          find . -path "*build/test-results/test/TEST-*.xml" -print | head -n 50 || true
          echo "=== First failing test files (head) ==="
          for f in $(find . -path "*build/test-results/test/TEST-*.xml" | head -n 5); do
            echo "---- $f ----"
            sed -n '1,220p' "$f"
          done

      - name: Debug Test Reports Directory
        if: always()
        run: ls -lR itachallenge-challenge/build/reports/tests/ || echo "⚠️ Test reports not found!"

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: itachallenge-challenge/build/reports/tests/

      # --- Sonar ---
      - name: Analyze (Sonar)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --info --no-build-cache
