name: Pull Request Sonar Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 21
      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.8
      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: ${{ runner.os }}-gradle

      # Ejecutar los tests y generar reportes
      - name: Run Tests
        run: ./gradlew test --info --stacktrace

      # Subir el reporte de tests como artefacto
      - name: Upload Test Report
        if: always()  # Se ejecuta aunque los tests fallen
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: itachallenge-challenge/build/reports/tests/test/

      - name: Analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: gradle build sonar --info
