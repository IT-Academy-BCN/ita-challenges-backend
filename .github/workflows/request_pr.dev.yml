name: Pull Request Sonar Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/settings.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Check Java & Gradle Version
        run: |
          java -version
          ./gradlew --version

      - name: Docker diagnostics
        run: |
          echo "DOCKER_HOST=$DOCKER_HOST"
          docker version
          docker info
          ls -l /var/run/docker.sock || true

      - name: Start Docker (if needed)
        run: |
          sudo systemctl start docker || true
          docker info

      - name: Build + Test
        run: ./gradlew build --info --stacktrace --no-build-cache --continue

      - name: Debug Test Reports Directory
        if: always()
        run: |
          ls -lR itachallenge-challenge/build/reports/tests/ || true
          ls -lR itachallenge-challenge/build/test-results/test/ || true

      - name: Print failing tests (JUnit XML)
        if: always()
        run: |
          echo "=== JUnit XML files (first 50) ==="
          find . -path "*build/test-results/test/TEST-*.xml" -print | head -n 50 || true

          echo "=== Showing first 250 lines of first 5 XMLs ==="
          for f in $(find . -path "*build/test-results/test/TEST-*.xml" | head -n 5); do
            echo "---- $f ----"
            sed -n '1,250p' "$f" || true
          done

      - name: Upload Test Report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html
          path: itachallenge-challenge/build/reports/tests/

      - name: Upload Test Results (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xml
          path: itachallenge-challenge/build/test-results/test/

      - name: Analyze (Sonar)
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --info --no-build-cache
