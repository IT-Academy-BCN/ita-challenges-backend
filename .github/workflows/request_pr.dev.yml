name: Pull Request Sonar Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/settings.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Check Java & Gradle Version
        run: |
          java -version
          ./gradlew --version

      # --- Docker / Testcontainers ---
      - name: Docker diagnostics
        run: |
          echo "DOCKER_HOST=$DOCKER_HOST"
          docker version
          docker info
          ls -l /var/run/docker.sock || true

      - name: Start Docker (if needed)
        run: |
          sudo systemctl start docker || true
          docker info

      # --- Build & Tests (capture full log) ---
      - name: Build + Test (capture log)
        run: |
          ./gradlew build --info --stacktrace --no-build-cache --continue 2>&1 | tee gradle-build.log

      # Extract the real failure reason from the captured log
      - name: Extract failure reason
        if: always()
        run: |
          echo "=== What went wrong / Caused by / FAILED (from gradle-build.log) ==="
          grep -nE "^\* What went wrong:|^Caused by:| FAILED$" gradle-build.log | head -n 250 || true

      # Always show what reports exist
      - name: Debug Test Reports Directory
        if: always()
        run: |
          ls -lR itachallenge-challenge/build/reports/tests/ || true
          ls -lR itachallenge-challenge/build/test-results/test/ || true

      # Upload the Gradle log so we can inspect it even if the UI truncates output
      - name: Upload Gradle Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      # Upload reports (HTML)
      - name: Upload Test Report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html
          path: itachallenge-challenge/build/reports/tests/

      # Upload test results (XML)
      - name: Upload Test Results (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xml
          path: itachallenge-challenge/build/test-results/test/

      # --- Sonar (only if build passed) ---
      - name: Analyze (Sonar)
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --info --no-build-cache
