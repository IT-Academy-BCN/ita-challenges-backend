name: Pull Request Sonar Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/settings.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Check Java & Gradle Version
        run: |
          java -version
          ./gradlew --version

      # --- Docker / Testcontainers ---
      - name: Docker diagnostics
        run: |
          echo "DOCKER_HOST=$DOCKER_HOST"
          docker version
          docker info
          ls -l /var/run/docker.sock || true

      - name: Start Docker (if needed)
        run: |
          sudo systemctl start docker || true
          docker info

      # --- Build & Tests (capture log + always print failure reason) ---
      - name: Build + Test (capture log + print failure)
        run: |
          set +e
          ./gradlew build --info --stacktrace --no-build-cache --continue 2>&1 | tee gradle-build.log
          EXIT_CODE=${PIPESTATUS[0]}

          if [ "$EXIT_CODE" -ne 0 ]; then
            echo ""
            echo "==================== BUILD FAILED: extracting reason ===================="
            echo "=== LAST 400 LINES ==="
            tail -n 400 gradle-build.log || true

            echo ""
            echo "=== Key markers (first matches) ==="
            grep -nE "FAILURE:|Build failed with an exception|\\* What went wrong:|\\* Exception is:|Caused by:|> Task .* FAILED" gradle-build.log | head -n 200 || true
            echo "======================================================================="
          fi

          exit $EXIT_CODE

      # Upload the Gradle log so we can inspect it even if the UI truncates output
      - name: Upload Gradle Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      # Upload problems report if present (Gradle 8.11+ sometimes writes it)
      - name: Upload Gradle Problems Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-problems-report
          path: build/reports/problems/

      # Test artifacts (XML + HTML) for easy debugging
      - name: Upload Test Results (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xml
          path: "**/build/test-results/test/"

      - name: Upload Test Report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html
          path: "**/build/reports/tests/"

      # --- Sonar (only if build passed) ---
      - name: Analyze (Sonar)
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --info --no-build-cache
