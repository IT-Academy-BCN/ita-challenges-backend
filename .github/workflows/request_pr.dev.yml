name: Pull Request Sonar Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    env:
      # Logs de testcontainers
      TESTCONTAINERS_LOG_LEVEL: DEBUG

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Docker
        run: |
          set -euxo pipefail
          docker version
          docker info
          docker ps
          ls -la /var/run/docker.sock || true

      - name: Run Tests (with extra logs)
        run: |
          set -euxo pipefail
          ./gradlew clean test \
            --no-daemon \
            --console=plain \
            --info \
            --stacktrace \
            -Dorg.gradle.logging.level=info \
            -Dtestcontainers.reuse.enable=false

      - name: Dump Testcontainers logs
        if: always()
        run: |
          set -euxo pipefail
          echo "== ~/.testcontainers.properties (if any) =="
          cat ~/.testcontainers.properties || true
          echo "== Docker containers (all) =="
          docker ps -a || true
          echo "== Docker logs of ryuk (if exists) =="
          docker ps -a --format '{{.ID}} {{.Names}}' | grep -i ryuk || true
          RYUK_ID=$(docker ps -a --format '{{.ID}} {{.Names}}' | awk 'tolower($2) ~ /ryuk/ {print $1; exit}')
          if [ -n "${RYUK_ID:-}" ]; then docker logs "$RYUK_ID" || true; fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/build/test-results/test/"

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: "**/build/reports/tests/"

      - name: SonarCloud Analysis
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --no-daemon --info
