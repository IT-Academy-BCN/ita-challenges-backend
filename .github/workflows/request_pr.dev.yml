name: Pull Request Sonar Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache SonarCloud packages
        uses: actions/cache@v3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/settings.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle

      - name: Check Java & Gradle Version
        run: |
          java -version
          ./gradlew --version

      # --- Docker / Testcontainers ---
      - name: Docker diagnostics
        run: |
          echo "DOCKER_HOST=$DOCKER_HOST"
          docker version
          docker info
          ls -l /var/run/docker.sock || true

      - name: Start Docker (if needed)
        run: |
          sudo systemctl start docker || true
          docker info

      # --- Build & Tests (capture full log) ---
      - name: Build + Test (capture log)
        run: |
          ./gradlew build --info --stacktrace --no-build-cache --continue 2>&1 | tee gradle-build.log

      # ✅ Robust extraction (works even when "* What went wrong" isn't matched)
      - name: Extract failure reason (robust)
        if: always()
        run: |
          echo "=== Showing last 250 lines (usually contains the real error) ==="
          tail -n 250 gradle-build.log || true

          echo
          echo "=== Key markers (FAILURE / Task FAILED / Caused by) ==="
          grep -nE "FAILURE:|Build failed with an exception|\\* Exception is:|\\* What went wrong:|Caused by:|> Task .* FAILED" gradle-build.log | head -n 200 || true

          echo
          echo "=== Context around first FAILURE block (lines after FAILURE:) ==="
          fail_line=$(grep -n "FAILURE:" gradle-build.log | head -n 1 | cut -d: -f1 || true)
          if [ -n "$fail_line" ]; then
            start=$((fail_line))
            end=$((fail_line + 140))
            echo "Printing lines $start..$end"
            sed -n "${start},${end}p" gradle-build.log || true
          else
            echo "No FAILURE: line found in gradle-build.log"
          fi

          echo
          echo "=== Context around first Task FAILED line ==="
          task_line=$(grep -nE "> Task .* FAILED" gradle-build.log | head -n 1 | cut -d: -f1 || true)
          if [ -n "$task_line" ]; then
            start=$((task_line - 40))
            if [ $start -lt 1 ]; then start=1; fi
            end=$((task_line + 80))
            echo "Printing lines $start..$end"
            sed -n "${start},${end}p" gradle-build.log || true
          else
            echo "No '> Task ... FAILED' line found in gradle-build.log"
          fi

      # Upload the Gradle log so we can inspect it even if the UI truncates output
      - name: Upload Gradle Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      # Upload problems report if present (Gradle 8.11+ sometimes writes it)
      - name: Upload Gradle Problems Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-problems-report
          path: build/reports/problems/

      # Test artifacts (XML + HTML) for easy debugging
      - name: Upload Test Results (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xml
          path: "**/build/test-results/test/"

      - name: Upload Test Report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html
          path: "**/build/reports/tests/"

      # --- Sonar (only if build passed) ---
      - name: Analyze (Sonar)
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --info --no-build-cache
