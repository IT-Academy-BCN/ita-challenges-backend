spring:
  application:
    name: itachallenge-challenge
    version: 2.0.4-RELEASE
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  jmx:
    enabled: true
  data:
    mongodb:
      #uri: mongodb://admin_challenge:BYBcMJEEWw5egRUo@localhost:27017/challenges?authSource=admin
      uri: mongodb://test_challenge:SBM55CTYA8Ui32yC@87.106.229.175:27017/challenges?authSource=admin
      # uri: mongodb://mongodb-test:27017/challenge
      uuid-representation: standard
  #profiles:
    #active: mongock
mongock:
  enabled: true
  transactionEnabled: false
  migration-scan-package: com.itachallenge.challenge.config.dbchangelog
  lock:
    collectionName: "mongockLocks" # Name of the collection used to lock the execution of the migration
    maxWaitingForLockMinutes: 5
    maxTries: 3 # Number of times to try to acquire a lock
    maxTriesInterval: 1000 # Interval in milliseconds between tries to acquire a lock


springdoc:
  swagger-ui:
    path: "/swagger-ui-custom.html"
    operationsSorted: method
  api-docs:
    enable: true
    path: "/api-docs"

server:
  port: 8762

management:
  endpoints:
    web:
      exposure:
        include: "*"
  security:
    enabled: false

logging:
  level:
    root: INFO
    "[org.springframework]": ERROR
    "[com.itachallenge]": INFO
  pattern:
    # console: Spring's default
    file: "%date %5level %-40.40logger{39} [%thread] %msg%n"
#  file:
#    name: itachallenge-challenge.log

url:
  connection_timeout: 30000
  maxBytesInMemory: 30000000

validation:
  number: "^\\d{1,9}$"                             # Integers up to 9 digits

messages:
  errorMessage: "Invalid values."

user:
  service:
    url: http://apisix-gateway:9080 # IN PRODUCTION
    #url: http://172.17.0.2:8764 # LOCAL IP
  endpoints:
    favorites: /itachallenge/api/v1/userinteraction/favorites/users/{userId}/favorites/{challengeId}
    bookmarks: /itachallenge/api/v1/user/users/{userId}/bookmarks/{challengeId}

token:
  signing:
    key: someRandomStringToProtectThisAppFromAttacks
  expiration:
    minutes: 600

