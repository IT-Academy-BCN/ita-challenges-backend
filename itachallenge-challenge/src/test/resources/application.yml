spring:
  application:
    name: itachallenge-challenge
    version: 1.2.0-RELEASE
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/itachallenge_test?directConnection=true}
  jmx:
    enabled: true

mongock:
  enabled: true
  transactionEnabled: false
  migration-scan-package: com.itachallenge.challenge.config.dbchangelog
  lock:
    collectionName: "mongockLocks"
    maxWaitingForLockMinutes: 5
    maxTries: 3
    maxTriesInterval: 1000

server:
  port: 8762

management:
  endpoints:
    web:
      exposure:
        include: "*"
  security:
    enabled: false

logging:
  level:
    root: INFO
    "[org.springframework]": ERROR
    "[com.itachallenge]": INFO
  pattern:
    file: "%date %5level %-40.40logger{39} [%thread] %msg%n"
#  file:
#    name: itachallenge-challenge.log

url:
  connection_timeout: 30000
  fake_connection_timeout: 1
  maxBytesInMemory: 30000000
  ds_test: https://swapi.py4e.com/api/vehicles/

validation:
  number: "^\\d{1,9}$"
  maxLimit200: "^-1$|^([1-9]\\d?|1\\d{2}|200)$"
  defaultLimit: 200

messages:
  errorMessage: "Invalid values."

user:
  service:
    url: http://notreallymatters
  endpoints:
    favorites: /itachallenge/api/v1/userinteraction/favorites/users/{userId}/favorites/{challengeId}
    bookmarks: /itachallenge/api/v1/user/users/{userId}/bookmarks/{challengeId}

token:
  signing:
    key: someRandomStringToProtectThisAppFromAttacks
  expiration:
    minutes: 600
