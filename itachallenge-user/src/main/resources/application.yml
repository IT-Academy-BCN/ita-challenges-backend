spring:
  application:
    name: itachallenge-user
    version: 2.2.0-RELEASE
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  jmx:
    enabled: true
  data:
    mongodb:
      #uri: mongodb://admin_user:yxRG4sYBDjPFzbh5@localhost:27017/users?authSource=admin
      uri: mongodb://test_users:xoDjk4eDvu5KWaCB@87.106.229.175:27017/users?authSource=admin
      #uri: mongodb://localhost:27017/users
      #uri: mongodb://mongodb-test:27017/users
      uuid-representation: standard
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

github-core:
  user-info-uri: https://api.github.com/user

springdoc:
  swagger-ui:
    path: "/swagger-ui-custom.html"
    operationsSorted: method
  api-docs:
    enable: true
    path: "/api-docs"

server:
  port: 8764
  tomcat:
    max-http-form-post-size: 2097152

management:
  endpoints:
    web:
      exposure:
        include: "*"
  security:
    enabled: false

url:
  max_length: 2048

logging:
  level:
    root: INFO
    "[org.springframework]": ERROR
    "[com.businessassistantbcn]": INFO
  pattern:
    # console: Spring's default
    file: "%date %5level %-40.40logger{39} [%thread] %msg%n"
#  file:
#    name: itachallenge-user.log

validation:
  mongodb_pattern: "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"

challenge:
  service:
    url: http://apisix-gateway:9080 # IN PRODUCTION
    #url: http://172.17.0.2:8762 # LOCAL IP